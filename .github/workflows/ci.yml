name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      ET6_REDIS_HOST: 127.0.0.1
      ET6_REDIS_PORT: 6379
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit and Feature tests
            command: vendor/bin/phpunit
            quality: true
          - name: Integration tests
            command: vendor/bin/phpunit tests/Integration
            quality: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, grpc, rdkafka, redis, pdo_sqlite, zip
          coverage: none

      - name: Load read-only dependency key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CI_DEPENDENCIES_SSH_KEY }}

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-php-8.5-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.5-composer-

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        if: matrix.quality
        run: composer audit --locked --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction

      - name: PHP syntax
        run: find app routes config database -name "*.php" -print0 | xargs -0 -r -n1 -P "$(nproc)" php -l

      - name: Run Larastan
        if: matrix.quality
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run test suite
        run: ${{ matrix.command }}
